spring.application.name=SmartHangar
server.port=3001

spring.datasource.url=jdbc:sqlite:smarthangar.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

server.error.include-message=always

# AI integration. Export SMARTHANGAR_AI_API_KEY before starting Spring Boot.
smarthangar.ai.api-key=${SMARTHANGAR_AI_API_KEY:}
smarthangar.ai.model=${SMARTHANGAR_AI_MODEL:openrouter/free}
smarthangar.ai.base-url=${SMARTHANGAR_AI_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
smarthangar.ai.allow-fallback=true
